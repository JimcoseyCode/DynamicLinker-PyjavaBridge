syntax = "proto3";

package fr.lirmm.bridge.grpc;

option java_multiple_files = true;
option java_package = "fr.lirmm.bridge.grpc";
option java_outer_classname = "BridgeProto";

service BridgeService {
  // Execute a function by name with JSON arguments
  rpc Execute (FunctionRequest) returns (FunctionResponse) {}
  
  // List available functions (for discovery)
  rpc ListFunctions (Empty) returns (FunctionList) {}
}

message FunctionRequest {
  string function_name = 1;
  string args_json = 2; // Arguments serialized as JSON list/object
}

message FunctionResponse {
  bool success = 1;
  string result_json = 2; // Result serialized as JSON
  string error_message = 3;
}

message Empty {}

message FunctionList {
  repeated string function_names = 1;
}
